[project]
name = "sdlc-harness"
version = "0.1.0"
description = "Workflow execution harness for SDLC context handoff"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=7.4,<9",
    "pytest-xdist>=3.6,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "integration: uses real local Git, subprocess, or HTTP infrastructure",
    "journey: exercises handoff across multiple SDLC workflow phases",
]
